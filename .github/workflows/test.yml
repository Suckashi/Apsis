name: Test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      release_check:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:docs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:settings:browser
      - run: npm run test:bots:browser
      - run: npm run test:chat:browser
      - run: npm run test:release
        if: inputs.release_check || github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-${{ matrix.os }}
          path: artifacts/
