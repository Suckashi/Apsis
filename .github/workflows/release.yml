name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/test.yml
    with:
      release_check: true
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-docs.ts --release "$RELEASE_TAG"
      - name: Publish verified source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Apsis $RELEASE_TAG" \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md" "${flags[@]}"
